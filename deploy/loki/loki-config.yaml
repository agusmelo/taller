auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  # 14 days — matches the local pg backup retention (scripts/backup-db.sh),
  # tune independently if you want logs kept longer than backups.
  retention_period: 336h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
