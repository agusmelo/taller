# Bootstrap config for `edge` — used ONLY before the first Let's Encrypt
# certificate exists. HTTP-only: serves the ACME challenge for certbot and
# proxies everything else to `frontend`, so the site stays reachable while
# the certificate is being issued.
#
# Usage (see docs/production-runbook.md, step "TLS bootstrap"):
#   1. Copy this file over nginx.conf (or point the compose mount at it),
#      `docker compose up -d edge`.
#   2. Run the first `certbot certonly --webroot ...` (see runbook).
#   3. Switch back to the real nginx.conf (the HTTPS one) and reload.

server {
  listen 80;
  listen [::]:80;
  server_name admin.tallerlallave.com grafana.tallerlallave.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
