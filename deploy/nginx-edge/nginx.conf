# Edge reverse proxy — terminates TLS and forwards everything to `frontend`
# (which keeps handling static Angular files + the internal /api proxy to
# `api:3000`, unchanged from workshop-frontend/nginx.conf). Grafana gets its
# own subdomain on the same certificate.
#
# Requires a certificate to already exist at
# /etc/letsencrypt/live/admin.tallerlallave.com/ — see nginx.bootstrap.conf
# and docs/production-runbook.md for how to get the first one.

server {
  listen 80;
  listen [::]:80;
  server_name admin.tallerlallave.com grafana.tallerlallave.com;

  # Kept available so `certbot renew` keeps working without switching
  # configs again.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name admin.tallerlallave.com;

  ssl_certificate     /etc/letsencrypt/live/admin.tallerlallave.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.tallerlallave.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Resolve at request time (Docker's embedded DNS) instead of once at nginx
  # startup — a static `proxy_pass http://frontend:80` makes nginx refuse to
  # start at all ("host not found in upstream") if `frontend` isn't up yet,
  # which defeats the point of edge/frontend/db and the observability stack
  # being independently startable.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $upstream_frontend frontend:80;
    proxy_pass http://$upstream_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name grafana.tallerlallave.com;

  ssl_certificate     /etc/letsencrypt/live/admin.tallerlallave.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.tallerlallave.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Grafana has its own login — this is just TLS + proxy, no extra auth here.
  # Consider adding an IP allowlist (allow/deny) if this only needs to be
  # reachable from your own network.
  #
  # Resolved at request time (see the admin.tallerlallave.com block above for
  # why) — this lets edge start fine before docker-compose.observability.yml
  # is ever brought up. Until it is, this block just 502s.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $upstream_grafana grafana:3000;
    proxy_pass http://$upstream_grafana;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
