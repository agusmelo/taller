services:

  db:
    image: postgres:16-alpine
    container_name: workshop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # No ports published to the host — only reachable by other containers on
    # the compose network, by service name (`db`). Publishing 5432 here would
    # expose Postgres directly to the internet on a VPS with no firewall rule
    # blocking it. Need a one-off connection? Use an SSH tunnel instead.
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Flyway reemplaza a migrations/run.js (ver
  # docs/database-migrations-and-rollbacks.md). Diferencia que importa: esto
  # SÍ trackea qué migración ya corrió (tabla flyway_schema_history) — nunca
  # vuelve a ejecutar una que ya aplicó, a diferencia de run.js, que corría
  # las 24 en cada deploy y fue la causa raíz del incidente de
  # docs/incidents/2026-09-22-mano-de-obra-pricing-mode.md.
  #
  # baselineOnMigrate + baselineVersion=24: la primera vez que esto corre
  # contra una base que YA tiene el historial de run.js (prod, tu Postgres de
  # dev), Flyway la marca como "ya está en V24" sin re-ejecutar nada, y
  # arranca a aplicar V25 en adelante. Contra una base nueva de verdad (CI,
  # un dev nuevo), no hay nada que baselinear — corre V1..V24 tal cual.
  migrate:
    image: flyway/flyway:10-alpine
    container_name: workshop-migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${DB_NAME}
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "24"
      FLYWAY_BASELINE_DESCRIPTION: pre-flyway (migrations/run.js)
    volumes:
      - ./workshop-backend/migrations:/flyway/sql:ro
    command: migrate
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: ozzon42/ozzon-images:migrate-${IMAGE_TAG:-latest}
    build:
      context: ./workshop-backend
    container_name: workshop-seed
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_RECEP_PASSWORD: ${SEED_RECEP_PASSWORD}
      SEED_MECH_PASSWORD: ${SEED_MECH_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: node scripts/seed.js
    restart: "no"

  api:
    image: ozzon42/ozzon-images:api-${IMAGE_TAG:-latest}
    build:
      context: ./workshop-backend
    container_name: workshop-api
    restart: unless-stopped
    # Run an init process (docker-init/tini) as PID 1, with node as its child.
    # This is the fix for the Chrome zombie leak: every PDF request launches a
    # Chrome that spawns its own subprocesses (zygote, gpu, renderers and the
    # long-lived chrome_crashpad_handler). When browser.close() ends the main
    # Chrome, those subprocesses are orphaned and reparented to PID 1. node is
    # not an init and never reap()s reparented grandchildren, so they pile up as
    # <defunct> zombies until the container can no longer fork() ("Cannot fork").
    # tini reaps them, so PIDs stay flat and the service runs indefinitely.
    init: true
    # Guardrail, not the fix: cap total processes so a future leak degrades this
    # one container instead of exhausting the whole VPS. A PDF render is ~10
    # short-lived Chrome procs; with reaping working they never accumulate, so
    # 512 leaves ample headroom for concurrent renders.
    pids_limit: 512
    # Not published to the host — frontend's nginx.conf already proxies
    # /api to api:3000 internally, and everything external goes through
    # `edge` on 80/443. Publishing 3000 here would let anyone bypass TLS
    # entirely by hitting http://vps-ip:3000 directly.
    expose:
      - "3000"
    volumes:
      - ./workshop-backend/assets:/app/assets:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      WORKSHOP_NAME: Taller La Llave
      WORKSHOP_ADDRESS: Ildemaro Ribas 1320, Sarandi Grande, Uruguay
      WORKSHOP_PHONE: "+598 99 354 032"
      WORKSHOP_EMAIL: lallavetaller@gmail.com
      WORKSHOP_LOGO_URL: /assets/logo.png
      WORKSHOP_SERVICES: "Diagnostico y Reparacion Mecanica · Inyeccion Electronica · Scanner · Inyeccion Diesel · Electronica Automotriz · Programacion y Codificacion del Automovil · Reparacion de Modulos"
      CORS_ORIGIN: ${CORS_ORIGIN}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  frontend:
    image: ozzon42/ozzon-images:web-${IMAGE_TAG:-latest}
    build:
      context: ./workshop-frontend
    container_name: workshop-frontend
    restart: unless-stopped
    # No publica nada al host: el reverse proxy del VPS (carpeta
    # reverse-proxy/, fuera de este repo — infraestructura neutral, no algo
    # que taller posea) lo alcanza por `edge`, la única red que comparte con
    # él. `default` (workshop-net) sigue siendo la red privada con
    # api/db/migrate — taller no necesita saber nada del proxy más allá de
    # este container_name y esta red.
    expose:
      - "80"
    networks:
      - default
      - edge
    depends_on:
      - api

volumes:
  pg_data:

# `default` sigue siendo privada (api/db/migrate, nada expuesto). `edge` es
# la red del reverse proxy del VPS — se crea con `docker network create edge`
# antes de levantar nada, y externa acá: taller no es su dueño.
networks:
  default:
    name: workshop-net
  edge:
    external: true
