name: taller

services:

  db:
    image: postgres:16-alpine
    container_name: workshop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # No ports published to the host — only reachable by other containers on
    # the compose network, by service name (`db`). Publishing 5432 here would
    # expose Postgres directly to the internet on a VPS with no firewall rule
    # blocking it. Need a one-off connection? Use an SSH tunnel instead.
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ozzon42/ozzon-images:migrate-${IMAGE_TAG:-latest}
    build:
      context: ./workshop-backend
    container_name: workshop-migrate
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_RECEP_PASSWORD: ${SEED_RECEP_PASSWORD}
      SEED_MECH_PASSWORD: ${SEED_MECH_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node migrations/run.js && node scripts/seed.js"
    restart: "no"

  api:
    image: ozzon42/ozzon-images:api-${IMAGE_TAG:-latest}
    build:
      context: ./workshop-backend
    container_name: workshop-api
    restart: unless-stopped
    # Not published to the host — frontend's nginx.conf already proxies
    # /api to api:3000 internally, and everything external goes through
    # `edge` on 80/443. Publishing 3000 here would let anyone bypass TLS
    # entirely by hitting http://vps-ip:3000 directly.
    expose:
      - "3000"
    volumes:
      - ./workshop-backend/assets:/app/assets:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      WORKSHOP_NAME: Taller La Llave
      WORKSHOP_ADDRESS: Ildemaro Ribas 1320, Sarandi Grande, Uruguay
      WORKSHOP_PHONE: "+598 99 354 032"
      WORKSHOP_EMAIL: lallavetaller@gmail.com
      WORKSHOP_LOGO_URL: /assets/logo.png
      WORKSHOP_SERVICES: "Diagnostico y Reparacion Mecanica · Inyeccion Electronica · Scanner · Inyeccion Diesel · Electronica Automotriz · Programacion y Codificacion del Automovil · Reparacion de Modulos"
      CORS_ORIGIN: ${CORS_ORIGIN}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ozzon42/ozzon-images:web-${IMAGE_TAG:-latest}
    build:
      context: ./workshop-frontend
    container_name: workshop-frontend
    restart: unless-stopped
    # Not published to the host anymore — sits behind `edge`, which is the
    # only thing exposed on 80/443. Reachable internally as `frontend:80`.
    expose:
      - "80"
    depends_on:
      - api

  edge:
    image: nginx:alpine
    container_name: workshop-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - frontend

  certbot:
    image: certbot/certbot
    container_name: workshop-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # No fixed command, default entrypoint (the image's own `certbot` binary)
    # left as-is — invoked on demand:
    #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d <domain> ...
    #   docker compose run --rm certbot renew --quiet
    # `docker compose run` only overrides the COMMAND, not the ENTRYPOINT — a
    # custom entrypoint here (e.g. /bin/true as a no-op placeholder) would
    # silently swallow both of the above, which is exactly what happened the
    # first time this ran: no error, no certificate, just a clean exit 0.

volumes:
  pg_data:
  certbot-etc:
  certbot-webroot:

# Named (not project-scoped) so docker-compose.observability.yml can attach
# to it as `external: true` — `edge` needs to reach `grafana` by service name.
networks:
  default:
    name: workshop-net
