name: taller-observability

# Log aggregation stack — separate from docker-compose.yml so it can be
# brought up/down independently. Attaches to the `workshop-net` network
# created by the main compose file (bring that up first).
#
# An explicit distinct project name (above) matters here: without it, both
# this file and docker-compose.yml default their project name to the
# containing directory, so Compose treats grafana/loki/promtail as part of
# the SAME project as db/api/frontend — every `docker compose` command
# scoped to just docker-compose.yml then reports them as "orphan
# containers" and, worse, can fail outright trying to reconcile them
# against a network they were never declared in.
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# Grafana is reachable at https://grafana.tallerlallave.com (via `edge` in
# the main compose file, see deploy/nginx-edge/nginx.conf).

services:
  loki:
    image: grafana/loki:2.9.4
    container_name: workshop-loki
    restart: unless-stopped
    volumes:
      - ./deploy/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.4
    container_name: workshop-promtail
    restart: unless-stopped
    volumes:
      - ./deploy/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: workshop-grafana
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.tallerlallave.com
      # Disable open signup / anonymous access explicitly (defaults are
      # already off, but this makes the intent explicit).
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki

volumes:
  loki_data:
  grafana_data:

networks:
  default:
    name: workshop-net
    external: true
